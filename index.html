<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2 realidade aumentada</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene
        mindar-image="imageTargetSrc: ./assets/targets/bomba-200.mind; autoStart: true; uiScanning: yes;"
        color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        

            <a-camera
                position="0 0 0"
                look-controls="enabled: false"></a-camera>

                
    <!--O =bjeto associado a imagem que será reconhecida-->
            <a-entity id="target"
            mindar-image-target="targetIndex: 0">
                <!--Cubo virtual-->
                <a-box
                position="0 -0.42 0.05"
                scale="1.55 .18 .55"
                color="#263746"
                material="metalness:.7;roughness:.35"></a-box>

                <a-cylinder position=".35 -.05 .18" rotation="90 0 0" radius=".23" height=".55" color="#1565a8" material="metalness: .55; roughness:.28"></a-cylinder>
                <a-cylinder position=".30 -.05 .18" rotation="90 0 0" radius=".25" height=".35" color="#0d4f7c" material="metalness: .6; roughness:.3"></a-cylinder>
                <a-cylinder position=".02 -.05 .18" rotation="90 0 0" radius=".09" height=".22" color="#f8a240" material="metalness: .5; roughness:.25"></a-cylinder>
                <a-cylinder position="-.50 -.05 .18" rotation="0 0 90" radius=".10" height=".42" color="#0d4f7c" ></a-cylinder>

                <a-sphere class="clickable hotspot" data-topic="motor" position=".42 .20 .38" radius="0.05" color="#36b9ff"
                animation="property: scale; from 1 1 1; to: 1.35 1.35 1.35; dur: 800; dir: alternate; loop: true"></a-sphere>

                <a-sphere class="clickable hotspot" data-topic="acoplamento" position=".02 .12 .38" radius="0.05" color="#f9d2e0"
                animation="property: scale; from 1 1 1; to: 1.35 1.35 1.35; dur: 950; dir: alternate; loop: true"></a-sphere>

                <a-sphere class="clickable hotspot" data-topic="bomba" position=".34 .20 .38" radius="0.05" color="#4fd48b"
                animation="property: scale; from 1 1 1; to: 1.35 1.35 1.35; dur: 1050; dir: alternate; loop: true"></a-sphere>

                <a-text value="TOQUE NOS PONTOS" align="center" color="#ffffff" width="1.8" position="0 .55 .08"></a-text>

            </a-entity>



    </a-scene>
</body>
</html>
